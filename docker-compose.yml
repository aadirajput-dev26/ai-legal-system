version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile        # points to the file we just added
    env_file:
      - .env                         # loads your environment variables
    ports:
      - "8080:8080"                  # adjust if your API uses a different port
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
